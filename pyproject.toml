[project]
name = "management-prd-vite"
version = "0.1.0"
description = "多项目需求记录桌面应用（Vue 3 + Vite + PyWebView + PyInstaller）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Project Authors" },
]
dependencies = [
    "pywebview>=5.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "platformdirs>=4.0.0",
    "tzdata>=2024.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
management-prd-vite = "management_prd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/management_prd"]

# ============ ruff ============

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line-too-long，formatter 会处理
    "RUF001", # 中文全角字符在字符串中
    "RUF002", # 中文全角字符在 docstring 中
    "RUF003", # 中文全角字符在注释中
]

[tool.ruff.lint.isort]
known-first-party = ["management_prd"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # 允许测试中使用 assert

# ============ mypy ============

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true

# webview(pywebview) 类型缺失时在此声明。
[[tool.mypy.overrides]]
module = ["webview.*"]
ignore_missing_imports = true

# ============ pytest ============

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
]

# ============ coverage ============

[tool.coverage.run]
source = ["src/management_prd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260724",
]
